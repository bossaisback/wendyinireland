<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wendy In Ireland With All luv💕</title>


    <!-- ==================================================
         Open Graph
         ================================================== -->

    <meta
        property="og:title"
        content="Wendy In Ireland With All luv💕"
    >

    <meta
        property="og:description"
        content="A little card collection made with love for Wendy in Ireland 💕"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="https://bossaisback.github.io/wendyinireland/"
    >

    <meta
        property="og:image"
        content="https://bossaisback.github.io/wendyinireland/home.webp"
    >


    <!-- ==================================================
         Twitter / X
         ================================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Wendy In Ireland With All luv💕"
    >

    <meta
        name="twitter:description"
        content="A little card collection made with love for Wendy in Ireland 💕"
    >

    <meta
        name="twitter:image"
        content="https://bossaisback.github.io/wendyinireland/home.webp"
    >


    <style>


        /* ==================================================
           基本設定
           ================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
        }


        body {

            background: #80389e;

            display: flex;

            justify-content: center;
        }


        .page {

            width: 100%;

            max-width: 1080px;

            min-height: 100vh;

            position: relative;
        }



        /* ==================================================
           首頁
           ================================================== */

        #homePage {

            width: 100%;

            position: relative;

            overflow: hidden;
        }


        .home-image {

            display: block;

            width: 100%;

            height: auto;
        }



        /* ==================================================
           首頁飛機動畫

           檔案：
           airplane.webp

           設計位置：
           Y = 269

           顯示尺寸：
           845 × 230

           原始檔：
           431 × 185 px

           動畫：
           左 → 右
           無限循環
           ================================================== */

        .airplane {

            position: absolute;

            left: 0;

            top: 13%;

            width: 15%;

            height: 5%;

            object-fit: fill;

            z-index: 12;

            pointer-events: none;

            animation:
                airplaneMove 12s linear infinite;
        }


        @keyframes airplaneMove {

            0% {

                transform:
                    translateX(-100%);
            }


            100% {

                transform:
                    translateX(80vw);
            }

        }



        /* ==================================================
           START BUTTON

           X = 353 ~ 727
           Y = 1033 ~ 1242
           ================================================== */

        .start-button {

            position: absolute;

            left: 32.69%;

            top: 53.80%;

            width: 34.63%;

            height: 10.89%;

            background: rgba(255,255,255,0.001);

            border: none;

            padding: 0;

            margin: 0;

            cursor: pointer;

            z-index: 20;

            transition:
                background-color 0.2s ease;
        }


        .start-button:hover {

            background:
                rgba(255,255,255,0.18);
        }


        .start-button:active {

            background:
                rgba(255,255,255,0.28);
        }



        /* ==================================================
           87%...

           X = 883
           Y = 866
           ================================================== */

        .loading-bar {

            position: absolute;

            left: 81.76%;

            top: 45.10%;

            width: 6.7593%;

            height: auto;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            gap: 0;

            z-index: 15;
        }


        .loading-char {

            display: block;

            flex: none;

            height: auto;

            object-fit: contain;
        }


        .loading-8 {

            width: 19.34%;

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0s;
        }


        .loading-7 {

            width: 19.34%;

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0.18s;
        }


        .loading-percent {

            width: 29.01%;

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0.36s;
        }


        .loading-dot-1 {

            width: 9.67%;

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0.54s;
        }


        .loading-dot-2 {

            width: 9.67%;

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0.72s;
        }


        .loading-dot-3 {

            width: 9.67%;

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0.90s;
        }


        @keyframes loadingJump {

            0%,
            72%,
            100% {

                transform:
                    translateY(0);
            }


            8% {

                transform:
                    translateY(-4px);
            }


            16% {

                transform:
                    translateY(0);
            }

        }



        /* ==================================================
           START 手指

           X = 658 ~ 763
           Y = 1166 ~ 1285
           ================================================== */

        .start-hand {

            position: absolute;

            left: 60.93%;

            top: 60.73%;

            width: 9.72%;

            height: auto;

            object-fit: contain;

            z-index: 25;

            pointer-events: none;

            animation:
                handPulse 1.8s ease-in-out infinite;
        }


        @keyframes handPulse {

            0%,
            100% {

                opacity: 0.55;

                filter:
                    brightness(1);
            }


            50% {

                opacity: 1;

                filter:
                    brightness(1.18);
            }

        }



        /* ==================================================
           問題頁
           ================================================== */

        #cardPage {

            display: none;

            width: 100%;

            background: #ffc1ff;

            position: relative;
        }


        body.card-mode {

            background: #ffc1ff;
        }


        .question-page {

            position: relative;

            width: 100%;

            max-width: 1080px;

            margin: 0 auto;
        }


        .question-background {

            display: block;

            width: 100%;

            height: auto;

            margin: 0;

            padding: 0;
        }



        /* ==================================================
           一般 Card 哭臉

           X = 930 ~ 981
           Y = 1391 ~ 1442
           ================================================== */

        .cry-face {

            position: absolute;

            left: 86.11%;

            top: 72.45%;

            width: 4.73%;

            height: auto;

            z-index: 10;

            pointer-events: none;

            animation:
                cryBounce 1.8s ease-in-out infinite;
        }


        @keyframes cryBounce {

            0%,
            100% {

                transform:
                    translateY(0);
            }


            50% {

                transform:
                    translateY(-5px);
            }

        }



        /* ==================================================
           藍色蝴蝶

           新位置：
           X = 792 ~ 992
           Y = 72 ~ 175

           尺寸維持：
           200 × 103
           ================================================== */

        .blue-butterfly {

            position: absolute;

            left: 73.33%;

            top: 3.75%;

            width: 18.52%;

            height: auto;

            object-fit: contain;

            z-index: 10;

            pointer-events: none;
        }



        /* ==================================================
           粉愛心

           X = 265 ~ 327
           Y = 890 ~ 946
           ================================================== */

        .pink-heart {

            position: absolute;

            left: 24.54%;

            top: 46.35%;

            width: 5.74%;

            height: 2.92%;

            object-fit: fill;

            z-index: 10;

            pointer-events: none;
        }



        /* ==================================================
           相機

           X = 889 ~ 976
           Y = 1204 ~ 1285
           ================================================== */

        .camera {

            position: absolute;

            left: 82.31%;

            top: 62.71%;

            width: 8.06%;

            height: 4.22%;

            object-fit: fill;

            z-index: 10;

            pointer-events: none;
        }



        /* ==================================================
           手機

           X = 231 ~ 306
           Y = 1484 ~ 1575
           ================================================== */

        .phone {

            position: absolute;

            left: 21.39%;

            top: 77.29%;

            width: 6.94%;

            height: 4.74%;

            object-fit: fill;

            z-index: 10;

            pointer-events: none;
        }



        /* ==================================================
           特殊 Card floating object

           適用：
           card001
           card013
           card014

           X = 135
           Y = 1002

           顯示：
           199.09 × 74.66

           檔案：
           floating-object.webp
           ================================================== */

        .floating-object {

            position: absolute;

            left: 12.50%;

            top: 52.19%;

            width: 18.43%;

            height: auto;

            z-index: 12;

            pointer-events: none;

            display: none;

            animation:
                floatingMove 2.8s ease-in-out infinite;
        }


        @keyframes floatingMove {

            0%,
            100% {

                transform:
                    translateY(0);
            }


            50% {

                transform:
                    translateY(-6px);
            }

        }



        /* ==================================================
           特殊 Card GIF

           適用：
           card001
           card013
           card014

           X = 45 ~ 971
           Y = 34 ~ 577

           W = 926.38
           H = 542.86

           檔案：
           special-animation.gif
           ================================================== */

        .special-animation {

            position: absolute;

            left: 4.17%;

            top: 1.77%;

            width: 85.78%;

            height: auto;

            z-index: 11;

            object-fit: contain;

            pointer-events: none;

            display: none;
        }



        /* ==================================================
           特殊 Card 模式

           card001
           card013
           card014

           隱藏一般裝飾
           ================================================== */

        .special-card-mode .blue-butterfly,
        .special-card-mode .pink-heart,
        .special-card-mode .cry-face,
        .special-card-mode .camera,
        .special-card-mode .phone {

            display: none;
        }


        .special-card-mode .floating-object {

            display: block;
        }


        .special-card-mode .special-animation {

            display: block;
        }



        /* ==================================================
           回首頁

           X = 349 ~ 490
           Y = 1593 ~ 1734
           ================================================== */

        .back-home-button {

            position: absolute;

            left: 32.31%;

            top: 82.97%;

            width: 13.06%;

            height: 7.34%;

            background:
                rgba(255,255,255,0.001);

            border: none;

            padding: 0;

            margin: 0;

            cursor: pointer;

            z-index: 20;
        }


        .back-home-button:hover {

            background:
                rgba(255,255,255,0.10);
        }


        .back-home-button:active {

            background:
                rgba(255,255,255,0.18);
        }



        /* ==================================================
           再抽一題

           X = 585 ~ 737
           Y = 1597 ~ 1749
           ================================================== */

        .draw-card-button {

            position: absolute;

            left: 54.17%;

            top: 83.18%;

            width: 14.05%;

            height: 7.90%;

            background:
                rgba(255,255,255,0.001);

            border: none;

            padding: 0;

            margin: 0;

            cursor: pointer;

            z-index: 20;
        }


        .draw-card-button:hover {

            background:
                rgba(255,255,255,0.10);
        }


        .draw-card-button:active {

            background:
                rgba(255,255,255,0.18);
        }



        /* ==================================================
           手機版
           ================================================== */

        @media (max-width: 600px) {

            .page {

                width: 100%;
            }


            .question-page {

                width: 100%;
            }

        }


    </style>

</head>



<body>


    <div class="page">


        <!-- ==================================================
             首頁
             ================================================== -->

        <div id="homePage">


            <img
                src="home.webp"
                alt="Wendy In Ireland With All luv💕"
                class="home-image"
            >


            <!-- ==================================================
                 首頁飛機
                 ================================================== -->

            <img
                src="airplane.webp"
                class="airplane"
                alt=""
            >



            <!-- ==================================================
                 87%...
                 ================================================== -->

            <div class="loading-bar">


                <img
                    src="loading-8.png"
                    class="loading-char loading-8"
                    alt=""
                >


                <img
                    src="loading-7.png"
                    class="loading-char loading-7"
                    alt=""
                >


                <img
                    src="loading-percent.png"
                    class="loading-char loading-percent"
                    alt=""
                >


                <img
                    src="loading-dot1.png"
                    class="loading-char loading-dot-1"
                    alt=""
                >


                <img
                    src="loading-dot2.png"
                    class="loading-char loading-dot-2"
                    alt=""
                >


                <img
                    src="loading-dot3.png"
                    class="loading-char loading-dot-3"
                    alt=""
                >


            </div>



            <!-- ==================================================
                 START
                 ================================================== -->

            <button
                class="start-button"
                onclick="startCard()"
                aria-label="開始抽卡"
            ></button>



            <!-- ==================================================
                 START 手指
                 ================================================== -->

            <img
                src="start-hand.webp"
                class="start-hand"
                alt=""
            >


        </div>



        <!-- ==================================================
             問題頁
             ================================================== -->

        <div id="cardPage">


            <div
                id="questionPage"
                class="question-page"
            >


                <!-- ==================================================
                     卡片背景
                     ================================================== -->

                <img
                    id="questionBackground"
                    src="card001.webp"
                    alt="問題卡片"
                    class="question-background"
                >



                <!-- ==================================================
                     一般 Card 裝飾
                     ================================================== -->

                <!-- 藍色蝴蝶 -->

                <img
                    src="blue-butterfly.gif"
                    class="blue-butterfly"
                    alt=""
                >



                <!-- 粉愛心 -->

                <img
                    src="pink-heart.gif"
                    class="pink-heart"
                    alt=""
                >



                <!-- 哭臉 -->

                <img
                    src="cry-face.png"
                    class="cry-face"
                    alt=""
                >



                <!-- 相機 -->

                <img
                    src="camera.gif"
                    class="camera"
                    alt=""
                >



                <!-- 手機 -->

                <img
                    src="phone.gif"
                    class="phone"
                    alt=""
                >



                <!-- ==================================================
                     特殊 Card floating object
                     ================================================== -->

                <img
                    src="floating-object.webp"
                    class="floating-object"
                    alt=""
                >



                <!-- ==================================================
                     特殊 Card GIF
                     ================================================== -->

                <img
                    src="special-animation.gif"
                    class="special-animation"
                    alt=""
                >



                <!-- ==================================================
                     回首頁
                     ================================================== -->

                <button
                    class="back-home-button"
                    onclick="goHome()"
                    aria-label="回到首頁"
                ></button>



                <!-- ==================================================
                     再抽一題
                     ================================================== -->

                <button
                    class="draw-card-button"
                    onclick="drawCard()"
                    aria-label="再抽一題"
                ></button>


            </div>


        </div>


    </div>



    <!-- ==================================================
         JavaScript
         ================================================== -->

    <script>


        /* ==================================================
           所有問題卡片

           目前共 14 張
           ================================================== */

        const cards = [

            "card001.webp",
            "card002.webp",
            "card003.webp",
            "card004.webp",
            "card005.webp",
            "card006.webp",
            "card007.webp",
            "card008.webp",
            "card009.webp",
            "card010.webp",
            "card011.webp",
            "card012.webp",
            "card013.webp",
            "card014.webp"

        ];



        /* ==================================================
           特殊 Card

           card001
           card013
           card014
           ================================================== */

        const specialCards = [

            "card001.webp",
            "card013.webp",
            "card014.webp"

        ];



        /* ==================================================
           尚未抽過的卡片
           ================================================== */

        let remainingCards = [];



        /* ==================================================
           目前顯示的卡片
           ================================================== */

        let currentCard = "";



        /* ==================================================
           建立新的一輪抽卡池
           ================================================== */

        function resetCardPool() {

            remainingCards =
                [...cards];

        }



        /* ==================================================
           判斷目前是不是特殊 Card
           ================================================== */

        function updateCardDecorations() {


            const questionPage =
                document.getElementById(
                    "questionPage"
                );


            /*
                每次換卡先清除特殊模式
            */

            questionPage.classList.remove(
                "special-card-mode"
            );


            /*
                如果是特殊 Card
                就啟用特殊效果
            */

            if (
                specialCards.includes(
                    currentCard
                )
            ) {

                questionPage.classList.add(
                    "special-card-mode"
                );

            }

        }



        /* ==================================================
           隨機抽卡

           同一輪不重複
           14 張全部抽完後
           才重新開始下一輪
           ================================================== */

        function drawCard() {


            /*
                本輪抽完
                → 建立新的一輪
            */

            if (
                remainingCards.length === 0
            ) {

                resetCardPool();

            }


            /*
                隨機選擇
            */

            const randomIndex =
                Math.floor(
                    Math.random() *
                    remainingCards.length
                );


            /*
                取得卡片
            */

            currentCard =
                remainingCards[
                    randomIndex
                ];


            /*
                從本輪移除
            */

            remainingCards.splice(
                randomIndex,
                1
            );


            /*
                更換卡片背景
            */

            document.getElementById(
                "questionBackground"
            ).src =
                currentCard;


            /*
                更新裝飾
            */

            updateCardDecorations();

        }



        /* ==================================================
           START

           從首頁進入問題頁
           ================================================== */

        function startCard() {


            /*
                第一次使用時建立抽卡池
            */

            if (
                remainingCards.length === 0
            ) {

                resetCardPool();

            }


            /*
                隱藏首頁
            */

            document.getElementById(
                "homePage"
            ).style.display =
                "none";


            /*
                顯示問題頁
            */

            document.getElementById(
                "cardPage"
            ).style.display =
                "block";


            /*
                問題頁背景色
            */

            document.body.classList.add(
                "card-mode"
            );


            /*
                抽第一張
            */

            drawCard();

        }



        /* ==================================================
           回首頁

           保留目前抽卡進度
           ================================================== */

        function goHome() {


            document.getElementById(
                "cardPage"
            ).style.display =
                "none";


            document.getElementById(
                "homePage"
            ).style.display =
                "block";


            document.body.classList.remove(
                "card-mode"
            );

        }


    </script>


</body>

</html>
