
<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>給你的愛爾蘭抽卡</title>


    <style>

        /* ==================================================
           基本設定
           ================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
        }


        body {

            background: #80389e;

            display: flex;

            justify-content: center;
        }


        /* ==================================================
           網站主要容器
           ================================================== */

        .page {

            width: 100%;

            max-width: 1080px;

            min-height: 100vh;

            position: relative;
        }


        /* ==================================================
           首頁
           ================================================== */

        #homePage {

            width: 100%;

            position: relative;
        }


        .home-image {

            display: block;

            width: 100%;

            height: auto;
        }


        /* ==================================================
           START BUTTON
           ================================================== */

        /*
            首頁：

            1080 × 1920

            X = 353 ~ 727
            Y = 1033 ~ 1242
        */

        .start-button {

            position: absolute;

            left: 32.69%;

            top: 53.80%;

            width: 34.63%;

            height: 10.89%;

            background: rgba(255, 255, 255, 0.001);

            border: none;

            padding: 0;

            margin: 0;

            cursor: pointer;

            z-index: 20;

            transition:
                background-color 0.2s ease;
        }


        .start-button:hover {

            background: rgba(255, 255, 255, 0.18);
        }


        .start-button:active {

            background: rgba(255, 255, 255, 0.28);
        }


        /* ==================================================
           LOADING BAR
           ================================================== */

        .loading-bar {

            position: absolute;

            left: 81.76%;

            top: 44.60%;

            width: 73px;

            height: 30px;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            gap: 0;

            z-index: 15;
        }


        .loading-char {

            display: block;

            flex: none;

            object-fit: contain;

            height: 30px;

            width: auto;

            transform: translateY(0);
        }


        /* ==================================================
           Loading 動畫
           ================================================== */

        .loading-8 {

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0s;
        }


        .loading-7 {

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0.18s;
        }


        .loading-percent {

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0.36s;
        }


        .loading-dot-1 {

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0.54s;
        }


        .loading-dot-2 {

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0.72s;
        }


        .loading-dot-3 {

            animation:
                loadingJump 2.5s infinite;

            animation-delay: 0.90s;
        }


        @keyframes loadingJump {

            0%,
            72%,
            100% {

                transform: translateY(0);
            }


            8% {

                transform: translateY(-4px);
            }


            16% {

                transform: translateY(0);
            }

        }


        /* ==================================================
           START BUTTON 手指
           ================================================== */

        /*
            X = 658 ~ 763
            Y = 1166 ~ 1285

            105 × 119
        */

        .start-hand {

            position: absolute;

            left: 60.93%;

            top: 60.73%;

            width: 9.72%;

            height: 6.20%;

            object-fit: contain;

            z-index: 25;

            pointer-events: none;

            animation:
                handPulse 1.8s ease-in-out infinite;
        }


        @keyframes handPulse {

            0%,
            100% {

                opacity: 0.55;

                filter: brightness(1);
            }


            50% {

                opacity: 1;

                filter: brightness(1.18);
            }

        }


        /* ==================================================
           問題頁
           ================================================== */

        #cardPage {

            display: none;

            width: 100%;

            background: #ffc1ff;

            position: relative;
        }


        body.card-mode {

            background: #ffc1ff;
        }


        /*
            問題頁容器

            同樣使用：

            1080 × 1920
        */

        .question-page {

            position: relative;

            width: 100%;

            max-width: 1080px;

            margin: 0 auto;
        }


        /*
            問題頁完整背景

            1080 × 1920
        */

        .question-background {

            display: block;

            width: 100%;

            height: auto;

            margin: 0;

            padding: 0;
        }


        /* ==================================================
           哭臉
           ================================================== */

        /*
            原始設計：

            X = 930 ~ 981
            Y = 1391 ~ 1442

            51.1 × 51.1
        */

        .cry-face {

            position: absolute;

            left: 86.11%;

            top: 72.45%;

            width: 4.73%;

            height: auto;

            z-index: 10;

            pointer-events: none;

            animation:
                cryBounce 1.8s ease-in-out infinite;
        }


        /*
            哭臉上下跳動

            幅度約 5px
        */

        @keyframes cryBounce {

            0%,
            100% {

                transform: translateY(0);
            }


            50% {

                transform: translateY(-5px);
            }

        }


        /* ==================================================
           回首頁
           ================================================== */

        /*
            X = 349 ~ 490
            Y = 1593 ~ 1734

            141 × 141
        */

        .back-home-button {

            position: absolute;

            left: 32.31%;

            top: 82.97%;

            width: 13.06%;

            height: 7.34%;

            background: rgba(255, 255, 255, 0.001);

            border: none;

            padding: 0;

            margin: 0;

            cursor: pointer;

            z-index: 20;
        }


        .back-home-button:hover {

            background: rgba(255, 255, 255, 0.10);
        }


        .back-home-button:active {

            background: rgba(255, 255, 255, 0.18);
        }


        /* ==================================================
           再抽一題
           ================================================== */

        /*
            X = 585 ~ 737
            Y = 1597 ~ 1749

            151.75 × 151.75
        */

        .draw-card-button {

            position: absolute;

            left: 54.17%;

            top: 83.18%;

            width: 14.05%;

            height: 7.90%;

            background: rgba(255, 255, 255, 0.001);

            border: none;

            padding: 0;

            margin: 0;

            cursor: pointer;

            z-index: 20;
        }


        .draw-card-button:hover {

            background: rgba(255, 255, 255, 0.10);
        }


        .draw-card-button:active {

            background: rgba(255, 255, 255, 0.18);
        }


        /* ==================================================
           手機版
           ================================================== */

        @media (max-width: 600px) {

            .page {

                width: 100%;
            }


            .question-page {

                width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="page">


        <!-- ==================================================
             首頁
             ================================================== -->

        <div id="homePage">


            <!-- 首頁背景 -->

            <img
                src="home.webp"
                alt="給你的愛爾蘭抽卡"
                class="home-image"
            >



            <!-- ==================================================
                 Loading
                 ================================================== -->

            <div class="loading-bar">


                <img
                    src="loading-8.png"
                    class="loading-char loading-8"
                    alt=""
                >


                <img
                    src="loading-7.png"
                    class="loading-char loading-7"
                    alt=""
                >


                <img
                    src="loading-percent.png"
                    class="loading-char loading-percent"
                    alt=""
                >


                <img
                    src="loading-dot1.png"
                    class="loading-char loading-dot-1"
                    alt=""
                >


                <img
                    src="loading-dot2.png"
                    class="loading-char loading-dot-2"
                    alt=""
                >


                <img
                    src="loading-dot3.png"
                    class="loading-char loading-dot-3"
                    alt=""
                >


            </div>



            <!-- ==================================================
                 START
                 ================================================== -->

            <button
                class="start-button"
                onclick="startCard()"
                aria-label="開始抽卡"
            ></button>



            <!-- 手指 -->

            <img
                src="start-hand.webp"
                class="start-hand"
                alt=""
            >


        </div>



        <!-- ==================================================
             問題頁
             ================================================== -->

        <div id="cardPage">


            <div class="question-page">


                <!-- 問題頁背景 -->

                <img
                    id="questionBackground"
                    src="card001.webp"
                    alt="問題卡片"
                    class="question-background"
                >



                <!-- ==================================================
                     哭臉
                     ================================================== -->

                <img
                    src="cry-face.png"
                    alt=""
                    class="cry-face"
                >



                <!-- ==================================================
                     回首頁
                     ================================================== -->

                <button
                    class="back-home-button"
                    onclick="goHome()"
                    aria-label="回到首頁"
                ></button>



                <!-- ==================================================
                     再抽一題
                     ================================================== -->

                <button
                    class="draw-card-button"
                    onclick="drawCard()"
                    aria-label="再抽一題"
                ></button>


            </div>


        </div>


    </div>



    <!-- ==================================================
         JavaScript
         ================================================== -->

    <script>


        /* ==================================================
           問題卡片清單
           ==================================================

           之後新增卡片時，
           只要在這裡增加檔名。

           例如：

           "card001.webp",
           "card002.webp",
           "card003.webp"

        ================================================== */

        const cards = [

            "card001.webp"

        ];



        /* ==================================================
           尚未抽過的卡片
           ================================================== */

        let remainingCards = [];



        /* ==================================================
           建立新的一輪抽卡池
           ================================================== */

        function resetCardPool() {

            /*
                用 [...cards] 複製一份，
                避免直接修改原始卡片清單。
            */

            remainingCards = [...cards];

        }



        /* ==================================================
           隨機抽一張「尚未抽過」的卡
           ================================================== */

        function drawCard() {


            /*
                如果抽卡池已經空了，
                代表上一輪全部抽完。

                自動重新建立新的一輪。
            */

            if (remainingCards.length === 0) {

                resetCardPool();

            }


            /*
                隨機選擇位置
            */

            const randomIndex =
                Math.floor(
                    Math.random() * remainingCards.length
                );


            /*
                取得卡片檔名
            */

            const selectedCard =
                remainingCards[randomIndex];


            /*
                從「尚未抽過」清單移除

                這就是避免同一輪重複的關鍵。
            */

            remainingCards.splice(
                randomIndex,
                1
            );


            /*
                顯示抽中的卡片
            */

            document.getElementById(
                "questionBackground"
            ).src = selectedCard;

        }



        /* ==================================================
           START
           ================================================== */

        function startCard() {


            /*
                開始新的抽卡旅程

                每次從首頁重新開始，
                都重新建立一輪卡池。
            */

            resetCardPool();


            /*
                顯示問題頁
            */

            document.getElementById(
                "homePage"
            ).style.display = "none";


            document.getElementById(
                "cardPage"
            ).style.display = "block";


            document.body.classList.add(
                "card-mode"
            );


            /*
                立即抽第一張
            */

            drawCard();

        }



        /* ==================================================
           回首頁
           ================================================== */

        function goHome() {


            document.getElementById(
                "cardPage"
            ).style.display = "none";


            document.getElementById(
                "homePage"
            ).style.display = "block";


            document.body.classList.remove(
                "card-mode"
            );


            /*
                下一次從首頁開始時，
                會重新建立一輪卡池。
            */

        }


    </script>


</body>

</html>
