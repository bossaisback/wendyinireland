
<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>給你的愛爾蘭抽卡</title>


    <style>

        /* ==================================================
           基本設定
           ================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
        }


        body {

            /* 首頁背景色 */

            background: #80389e;

            display: flex;

            justify-content: center;
        }


        /* ==================================================
           網站主要容器
           ================================================== */

        .page {

            width: 100%;

            max-width: 1080px;

            min-height: 100vh;

            position: relative;
        }


        /* ==================================================
           首頁
           ================================================== */

        #homePage {

            width: 100%;

            position: relative;
        }


        /*
            首頁圖片

            尺寸：
            1080 × 1920
        */

        .home-image {

            display: block;

            width: 100%;

            height: auto;
        }


        /* ==================================================
           START BUTTON
           ================================================== */

        /*
            首頁尺寸：
            1080 × 1920

            點擊區域：
            X = 353 ~ 727
            Y = 1033 ~ 1242
        */

        .start-button {

            position: absolute;

            left: 32.69%;

            top: 53.80%;

            width: 34.63%;

            height: 10.89%;


            /* 幾乎完全透明 */

            background: rgba(255, 255, 255, 0.001);

            border: none;

            padding: 0;

            margin: 0;

            cursor: pointer;

            z-index: 10;


            transition:
                background-color 0.2s ease;
        }


        /* 滑鼠移到 START */

        .start-button:hover {

            background: rgba(255, 255, 255, 0.18);
        }


        /* 按下 START */

        .start-button:active {

            background: rgba(255, 255, 255, 0.28);
        }


        /* ==================================================
           問題頁
           ================================================== */

        #cardPage {

            display: none;

            width: 100%;

            min-height: 100vh;

            background: #ffc1ff;

            padding: 30px 20px 40px;

            text-align: center;
        }


        /*
            確保問題頁整個瀏覽器背景
            都是 #ffc1ff
        */

        body.card-mode {

            background: #ffc1ff;
        }


        /* ==================================================
           問題卡片
           ================================================== */

        .card {

            width: 100%;

            max-width: 1080px;

            margin: 0 auto 30px;
        }


        /*
            真正的問題卡片圖片

            尺寸：
            1080 × 1440
        */

        .card-image {

            display: block;

            width: 100%;

            height: auto;

            margin: 0 auto;
        }


        /* ==================================================
           再抽一題
           ================================================== */

        .card-button {

            border: none;

            border-radius: 999px;

            padding: 15px 30px;

            font-size: 18px;

            background: #222;

            color: white;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                transform 0.1s ease;
        }


        .card-button:hover {

            background: #444;
        }


        .card-button:active {

            transform: scale(0.97);
        }


        /* ==================================================
           回到首頁
           ================================================== */

        .back-home {

            display: block;

            margin: 15px auto 0;

            border: none;

            background: transparent;

            font-size: 14px;

            color: #555;

            cursor: pointer;
        }


        .back-home:hover {

            color: #222;
        }


        /* ==================================================
           手機版
           ================================================== */

        @media (max-width: 600px) {

            #cardPage {

                padding: 20px 10px 30px;
            }


            .card {

                margin-bottom: 20px;
            }


            .card-button {

                font-size: 16px;

                padding: 13px 25px;
            }


            .back-home {

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <div class="page">


        <!-- ==================================================
             首頁
             ================================================== -->

        <div id="homePage">


            <img
                src="home.webp"
                alt="給你的愛爾蘭抽卡"
                class="home-image"
            >


            <!-- START BUTTON -->

            <button
                class="start-button"
                onclick="startCard()"
                aria-label="開始抽卡"
            ></button>


        </div>



        <!-- ==================================================
             問題頁
             ================================================== -->

        <div id="cardPage">


            <!-- ==================================================
                 問題卡片
                 ================================================== -->

            <div
                id="card"
                class="card"
            >

                <!--
                    第一張測試卡

                    檔名：
                    card001.webp
                -->

                <img
                    src="card001.webp"
                    alt="問題卡片"
                    class="card-image"
                >

            </div>



            <!-- ==================================================
                 再抽一題
                 ================================================== -->

            <button
                class="card-button"
                onclick="drawCard()"
            >

                再抽一題

            </button>



            <!-- ==================================================
                 回到首頁
                 ================================================== -->

            <button
                class="back-home"
                onclick="goHome()"
            >

                回到首頁

            </button>


        </div>


    </div>



    <!-- ==================================================
         JavaScript
         ================================================== -->

    <script>


        /* ==================================================
           開始抽卡
           ================================================== */

        function startCard() {


            /* 隱藏首頁 */

            document.getElementById("homePage").style.display = "none";


            /* 顯示問題頁 */

            document.getElementById("cardPage").style.display = "block";


            /* 切換背景色 */

            document.body.classList.add("card-mode");


            /* 顯示第一張卡 */

            drawCard();

        }



        /* ==================================================
           抽卡
           ================================================== */

        function drawCard() {


            /*
                目前只有一張卡，
                所以暫時固定顯示 card001.webp。
            */


            document.getElementById("card").innerHTML = `

                <img
                    src="card001.webp"
                    alt="問題卡片"
                    class="card-image"
                >

            `;

        }



        /* ==================================================
           回到首頁
           ================================================== */

        function goHome() {


            /* 隱藏問題頁 */

            document.getElementById("cardPage").style.display = "none";


            /* 顯示首頁 */

            document.getElementById("homePage").style.display = "block";


            /* 恢復首頁背景 */

            document.body.classList.remove("card-mode");

        }


    </script>


</body>

</html>
